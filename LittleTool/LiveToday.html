<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LiveToday</title>
        <style>
            body{
                font-family:"Microsoft YaHei",sans_serif;
                max-width:600px;
                margin:40px auto;
                padding:0 20px;
                background:#f5f5f5;
            }
            h1{
                color:#333;
                border-bottom:2px solid #0689ee;
                padding-bottom:10px;
            }
            textarea{
                width:100%;
                height:500px;
                padding:12px;
                font-size:16px;
                border:1px solid #ccc;
                border-radius:8px;
                resize:vertical;
                line-height:1.6;
                box-sizing:border-box;
            }
            button{
                margin-top:10px;
                padding:10px 20px;
                font-size:16px;
                border:none;
                border-radius:6px;
                cursor:pointer;
            }
            .save-tip{
                color:#888;
                font-size:14px;
                margin-left:10px;
            }
            #clearBtn{
                background:#ff6b6b;
                color:while;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <h1> “今日事”</h1>
            <textarea id="todayText" placeholder="最近要做些什么呢……"></textarea>
            <button id="saveBtn">保存</button>
            <button id="clearBtn">清除</button>
            <span class="save-tip">已保存</span>
        </div>
        <script>
            const textarea=document.getElementById("todayText");
            const clearBtn=document.getElementById("clearBtn");

            const savedText=document.getItem("itemsToday");
            if(savedText){
                textarea.value=savedText;
            }

            textarea.addEventListener("input",function(){
                localStorage.setItem("itemsToday",textarea.value);
            });

            clearBtn.addEventListener("click",function(){
                textarea.value="";
                localStorage.removeItem("itemsToday");
            });
        </script>
    </body>
</html>
